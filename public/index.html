<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alejo's house dinner</title>
<meta name="description" content="Dinner at Alejo's every Thursday at 6pm. Pick a week and RSVP.">
<meta property="og:title" content="Alejo's house dinner">
<meta property="og:description" content="Every Thursday, 6pm. Pick a week and RSVP.">
<meta property="og:image" content="https://dinner.alejo.food/divino-nino.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
<style>
  :root { --bg: #fbf6f2; --fg: #2a2220; --muted: #7a6c66; --accent: #c2577a; --card: #fff; --line: #ecdfd8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1716; --fg: #f3ebe7; --muted: #a8978f; --accent: #e88aa8; --card: #262020; --line: #3a302e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width: 420px; margin: 0 auto; padding: 32px 16px 48px; }
  img { display: block; width: 180px; height: 216px; object-fit: cover; border-radius: 12px; margin: 0 auto 24px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 8px; text-align: center; }
  .info { color: var(--muted); text-align: center; margin: 0 0 28px; }
  .info a { color: inherit; }
  p.lead { margin: 0 0 12px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li a { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; margin-bottom: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    color: var(--fg); text-decoration: none; font-weight: 600; }
  li a:hover, li a:focus-visible { border-color: var(--accent); }
  li a span { color: var(--accent); font-weight: 500; }
</style>
</head>
<body>
<main>
  <img src="divino-nino.jpg" alt="Divino Niño in a pink tunic">
  <h1>Alejo's house dinner</h1>
  <p class="info">
    Every Thursday, 6pm · 12 seats<br>
    <a href="https://maps.google.com/?q=172+Aldersgate+Street,+London+EC1A">172 Aldersgate Street, Apt. 46</a>
  </p>
  <p class="lead">Pick a Thursday and RSVP:</p>
  <ul>
    <li><a href="https://partiful.com/e/nYUoyIiqg14GK136anly">Thu 19 Nov <span>RSVP →</span></a></li>
    <li><a href="https://partiful.com/e/R4o5eL0g8ym6XLmoaTIr">Thu 26 Nov <span>RSVP →</span></a></li>
    <li><a href="https://partiful.com/e/gFsU1p3PzxdhtSuOnt37">Thu 3 Dec <span>RSVP →</span></a></li>
  </ul>
</main>
</body>
</html>
